name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Wrangler must run from the app, not the workspace root.
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        working-directory: .

      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Create D1 database if missing
        run: npx wrangler d1 info octacore-db >/dev/null 2>&1 || npx wrangler d1 create octacore-db

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      # Generate the session-signing secret so nobody has to handle it.
      - name: Set auth secret if missing
        run: |
          secrets=$(npx wrangler secret list)
          if ! grep -q '"BETTER_AUTH_SECRET"' <<< "$secrets"; then
            openssl rand -base64 32 | npx wrangler secret put BETTER_AUTH_SECRET
          fi

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
